<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>lume-talentlens · Agent</title>
    <link rel="stylesheet" href="/app.css?v=1791511276" />
  </head>
  <body data-page="chat">
    <script>
      // Persist the chosen language across the nav tabs: the React shells
      // keep the language in localStorage (tl-lang) while the SSR pages
      // (/overview, /repos, /api) read it from ?lang=, so each static nav
      // link carries it — otherwise clicking a tab resets the language.
      (function () {
        try {
          var lang = localStorage.getItem("tl-lang") || "zh";
          document.querySelectorAll(".gh-nav a").forEach(function (a) {
            var href = a.getAttribute("href");
            if (!href || href.indexOf("lang=") !== -1) return;
            a.setAttribute("href", href + (href.indexOf("?") >= 0 ? "&" : "?") + "lang=" + lang);
          });
        } catch (e) { /* localStorage unavailable — links stay language-less */ }
      })();
    </script>
    <nav class="gh-nav">
      <a href="/" class="brand">lume-talentlens</a>
      <a href="/" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/overview" data-i18n="nav.ssr_overview">SSR Overview</a>
      <a href="/repos" data-i18n="nav.ssr_repos">SSR Repos</a>
      <a href="/api" data-i18n="nav.api">API</a>
      <a href="/chat" class="active" data-i18n="nav.agent">Agent</a>
      <span id="gh-lang"></span>
    </nav>
    <div id="gh-root" class="agent-wrap">
      <p class="gh-loading">loading agent…</p>
    </div>
    <script type="module" src="/app.js?v=1791511276"></script>
  </body>
</html>
