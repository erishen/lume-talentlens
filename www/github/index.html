<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>lume-talentlens · Dashboard</title>
    <link rel="stylesheet" href="/app.css?v=1791509476" />
  </head>
  <body data-page="dashboard">
    <script>
      // Persist the chosen language across the nav tabs (see chat.html for
      // the why): the React shell stores the language in localStorage
      // (tl-lang); the SSR pages read ?lang=, so static nav links carry it.
      (function () {
        try {
          var lang = localStorage.getItem("tl-lang") || "zh";
          document.querySelectorAll(".gh-nav a").forEach(function (a) {
            var href = a.getAttribute("href");
            if (!href || href.indexOf("lang=") !== -1) return;
            a.setAttribute("href", href + (href.indexOf("?") >= 0 ? "&" : "?") + "lang=" + lang);
          });
        } catch (e) { /* localStorage unavailable — links stay language-less */ }
      })();
    </script>
    <nav class="gh-nav">
      <a href="/" class="brand">lume-talentlens</a>
      <a href="/" class="active" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/overview" data-i18n="nav.ssr_overview">SSR Overview</a>
      <a href="/repos" data-i18n="nav.ssr_repos">SSR Repos</a>
      <a href="/api" data-i18n="nav.api">API</a>
      <a href="/chat" data-i18n="nav.agent">Agent</a>
      <span id="gh-lang"></span>
    </nav>
    <div id="gh-root">
      <p class="gh-loading">Loading dashboard…</p>
    </div>
    <script type="module" src="/app.js?v=1791509476"></script>
  </body>
</html>
