# CI for lume-talentlens — runs the same gates a local contributor would:
#   Lume type-check + sanity        (make check, against a freshly built full Lume)
#   Frontend unit tests + typecheck (pnpm test / pnpm typecheck)
#   API smoke on an isolated port   (make smoke, live calls skipped, fixture data)
#
# The app needs a FULL Lume build (release binaries lack http_get/put/delete).
# The full build is produced from the lume source repo, cloned + built here —
# exactly what README's "Requirements" describes for local dev.

name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g pnpm@12.5.1

      - name: Build full Lume binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev
          git clone --depth 1 --recurse-submodules https://github.com/erishen/lume.git /tmp/lume
          make -C /tmp/lume

      - name: Lume type-check + runtime sanity
        run: |
          # sanity.lume resolves the snapshot like the app does
          # (last_owner -> data/github/<owner>/snapshot.json); CI has no
          # gitignored data, so seed the minimal fixture first.
          mkdir -p data/github/erishen
          printf '%s' '{"fetched_at":"2026-01-01T00:00:00Z","owner":"erishen","profile":{"name":"Erishen","followers":1,"created_at":"2020-01-01T00:00:00Z"},"count":1,"non_fork_count":1,"repos":[{"name":"demo","language":"Python","stargazers_count":1,"forks_count":0,"open_issues_count":0,"fork":false,"archived":false,"description":"","html_url":"","topics":[],"created_at":"2020-01-01T00:00:00Z","updated_at":"2020-01-01T00:00:00Z","pushed_at":"2020-01-01T00:00:00Z","size":1,"license":null,"created_year":2020,"age_days":1,"days_since_push":1,"days_since_updated":1,"recency":"active","push_month":"2020-01"}]}' > data/github/erishen/snapshot.json
          printf 'erishen\n' > data/github/last_owner
          LUME=/tmp/lume/bin/lume make check

      - name: Frontend unit tests + typecheck
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: API smoke (isolated port, no live calls, minimal fixture)
        run: |
          mkdir -p data/github/erishen
          printf '%s' '{"fetched_at":"2026-01-01T00:00:00Z","owner":"erishen","profile":{"name":"Erishen","followers":1,"created_at":"2020-01-01T00:00:00Z"},"count":1,"non_fork_count":1,"repos":[{"name":"demo","language":"Python","stargazers_count":1,"forks_count":0,"open_issues_count":0,"fork":false,"archived":false,"description":"","html_url":"","topics":[],"created_at":"2020-01-01T00:00:00Z","updated_at":"2020-01-01T00:00:00Z","pushed_at":"2020-01-01T00:00:00Z","size":1,"license":null,"created_year":2020,"age_days":1,"days_since_push":1,"days_since_updated":1,"recency":"active","push_month":"2020-01"}]}' > data/github/erishen/snapshot.json
          printf '%s' '{"followers":[],"following":[],"totals":{"followers":1,"following":1},"note":"ci fixture"}' > data/github/erishen/people.json
          printf 'erishen\n' > data/github/last_owner
          LUME=/tmp/lume/bin/lume SKIP_LIVE=1 make smoke
